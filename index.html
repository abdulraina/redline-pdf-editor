<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redline PDF Editor</title>
<meta name="description" content="Free online PDF editor. Edit existing text with automatic font matching, 1,900+ Google Fonts, add text, draw, highlight, sign and rearrange pages. Files stay in your browser.">
<meta name="theme-color" content="#c4382c">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%223%22 width=%2220%22 height=%2226%22 rx=%222%22 fill=%22white%22 stroke=%22%231b2127%22 stroke-width=%222%22/%3E%3Cpath d=%22M9 17l14-3%22 stroke=%22%23c4382c%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600;700&display=swap">
<style>
/* Layout: proofing desk — tool rail | page strip | scrolling paper stack, red proofmark accent */
:root{
  --bg:#e9ecef; --panel:#f7f8f9; --panel-2:#ffffff; --line:#d3d8dd; --ink:#1b2127; --ink-2:#5b6670;
  --desk:#dde1e5; --accent:#c4382c; --accent-ink:#ffffff; --accent-soft:#f6dedb; --hover:#e6e9ec; --ok:#1d7a46; --shadow:0 1px 2px rgba(20,28,36,.12),0 6px 20px rgba(20,28,36,.10);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171a; --panel:#1b1f23; --panel-2:#22272c; --line:#2f363d; --ink:#e4e7ea; --ink-2:#9aa4ad;
  --desk:#101214; --accent:#ef6a5d; --accent-ink:#1a0d0b; --accent-soft:#3a201d; --hover:#272d33; --ok:#5cc98b; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --panel:#1b1f23; --panel-2:#22272c; --line:#2f363d; --ink:#e4e7ea; --ink-2:#9aa4ad;
  --desk:#101214; --accent:#ef6a5d; --accent-ink:#1a0d0b; --accent-soft:#3a201d; --hover:#272d33; --ok:#5cc98b; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--f-ui);overflow:hidden}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:52px 172px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);}
/* header */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand .mark{width:22px;height:26px;border-radius:2px;background:var(--panel-2);border:1.5px solid var(--ink);position:relative}
.brand .mark::after{content:"";position:absolute;left:3px;right:3px;top:11px;height:2px;background:var(--accent);transform:rotate(-8deg)}
.fname{color:var(--ink-2);font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.fname b{color:var(--ink);font-weight:500}
.chip{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--hover)}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
.ibtn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* property bar */
.props{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:45px;scrollbar-width:thin}
.props .grp{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);flex:none}
.props .grp:last-child{border-right:0}
.props label.cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin-right:2px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--accent) 45% 55%,transparent 55%),var(--panel-2)}
input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.props select,.props input[type=number]{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 6px}
.props input[type=number]{width:56px;font-family:var(--f-mono)}
.tog{height:28px;min-width:28px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:600}
.tog.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.props input[type=range]{width:80px;accent-color:var(--accent)}
.hint{color:var(--ink-2);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.hint .det b{color:var(--ink);font-weight:500}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--hover);color:var(--ink)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
/* tool rail */
.rail{grid-row:3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.rail .sep{width:24px;height:1px;background:var(--line);margin:4px 0}
.tool{width:38px;height:38px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--panel);padding:4px 8px;border-radius:4px;white-space:nowrap;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.tool .tip kbd{font-family:var(--f-mono);opacity:.7;margin-left:6px}
.tool:hover .tip{opacity:1}
/* thumbnails */
.thumbs{grid-row:3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.thumbs .head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.pageops{display:flex;flex-wrap:wrap;gap:0;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.pageops .ibtn{width:30px;height:30px}
.tlist{overflow-y:auto;padding:12px 0 24px;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1}
.th{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px;border-radius:6px;border:2px solid transparent}
.th.cur{border-color:var(--accent)}
.th.drop-before{box-shadow:0 -3px 0 var(--accent)}
.th.drop-after{box-shadow:0 3px 0 var(--accent)}
.th canvas{display:block;background:#fff;box-shadow:var(--shadow);max-width:120px}
.th span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* viewer */
.viewer{grid-row:3;background:var(--desk);overflow:auto;position:relative;min-width:0}
.stack{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px 80px;min-width:min-content}
.pg{position:relative;flex:none}
.pgi{position:absolute;left:50%;top:50%;background:#fff;box-shadow:var(--shadow)}
.pgi canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;overflow:hidden}
.viewer[data-tool="draw"] .ov,.viewer[data-tool="rect"] .ov,.viewer[data-tool="ellipse"] .ov,.viewer[data-tool="line"] .ov,.viewer[data-tool="arrow"] .ov,.viewer[data-tool="highlight"] .ov,.viewer[data-tool="whiteout"] .ov{cursor:crosshair;touch-action:none}
.viewer[data-tool="text"] .ov{cursor:text}
.viewer[data-tool="place"] .ov,.viewer[data-tool="stamp"] .ov{cursor:copy;touch-action:none}
.an{position:absolute;box-sizing:border-box}
.an.txt{white-space:pre;line-height:1.2;padding:0;outline:none;min-width:4px;cursor:move}
.an.txt[contenteditable]{cursor:text;outline:1px dashed var(--accent);outline-offset:2px;background:rgba(255,255,255,.35)}
.an.txt[contenteditable]:empty::before{content:"Type here";color:#9aa3ab}
.an.hl .vis{mix-blend-mode:multiply}
.an img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.viewer[data-tool="select"] .an{cursor:move}
.an.sel{outline:1.5px solid #2f7de1;outline-offset:2px}
.hdl{position:absolute;right:-7px;bottom:-7px;width:10px;height:10px;background:#fff;border:1.5px solid #2f7de1;border-radius:2px;cursor:nwse-resize;touch-action:none;box-sizing:border-box;z-index:2}
.hdl::after{content:"";position:absolute;inset:-7px}
.an .vis{position:absolute;inset:0;box-sizing:border-box;pointer-events:none}
.an .vis svg{width:100%;height:100%;display:block;overflow:visible}
.an.box>.hdl{right:auto;bottom:auto;transform:translate(-50%,-50%);width:11px;height:11px}
.an.box>.hdl[data-h="nw"]{left:-2px;top:-2px;cursor:nwse-resize}.an.box>.hdl[data-h="n"]{left:50%;top:-2px;cursor:ns-resize}
.an.box>.hdl[data-h="ne"]{left:calc(100% + 2px);top:-2px;cursor:nesw-resize}.an.box>.hdl[data-h="e"]{left:calc(100% + 2px);top:50%;cursor:ew-resize}
.an.box>.hdl[data-h="se"]{left:calc(100% + 2px);top:calc(100% + 2px);cursor:nwse-resize}.an.box>.hdl[data-h="s"]{left:50%;top:calc(100% + 2px);cursor:ns-resize}
.an.box>.hdl[data-h="sw"]{left:-2px;top:calc(100% + 2px);cursor:nesw-resize}.an.box>.hdl[data-h="w"]{left:-2px;top:50%;cursor:ew-resize}
.an.box>.hdl[data-h="n"],.an.box>.hdl[data-h="s"]{width:16px;height:7px;border-radius:3px}
.an.box>.hdl[data-h="e"],.an.box>.hdl[data-h="w"]{width:7px;height:16px;border-radius:3px}
.an.box>.rh{position:absolute;left:50%;top:-30px;width:14px;height:14px;transform:translateX(-50%);border-radius:50%;background:#2f7de1;border:2px solid #fff;box-shadow:0 0 0 1px #2f7de1;cursor:grab;touch-action:none;box-sizing:border-box;z-index:2}
.an.box>.rh::before{content:"";position:absolute;left:50%;top:12px;width:1.5px;height:16px;background:#2f7de1;transform:translateX(-50%)}
.an.box>.rh::after{content:"";position:absolute;inset:-8px}
.hdl.ep{right:auto;bottom:auto;transform:translate(-50%,-50%);border-radius:50%;width:12px;height:12px;cursor:move;pointer-events:auto}
.sizetip{position:fixed;z-index:70;background:var(--ink);color:var(--panel);font:11px/1 var(--f-mono);padding:5px 7px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.props .geo{width:52px}
.props .ibtn.on{background:var(--accent-soft);color:var(--accent)}
.stb{height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.stb svg{width:16px;height:16px}
.stb.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.stb.word{font-family:Arial,Helvetica,sans-serif;letter-spacing:.05em;border-width:2px}
.props input.stxt{width:120px;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 8px}
.modal.wide{width:min(760px,100%)}
.cropwrap{display:grid;place-items:center;background:repeating-conic-gradient(#e6e9ec 0 25%,#f7f8f9 0 50%) 0 0/16px 16px;border-radius:6px;padding:10px;border:1px solid var(--line)}
.cropwrap canvas{touch-action:none;display:block;cursor:crosshair}
.frm{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;align-items:center}
.frm label{color:var(--ink-2);font-size:12px}
.frm input[type=text],.frm input[type=number],.frm select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px;box-sizing:border-box;width:100%}
.frm input[type=range]{width:100%;accent-color:var(--accent)}
.frm .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.wmprev{height:120px;background:#fff;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.wmprev span{font:700 34px/1 Arial,Helvetica,sans-serif;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:5px 10px;cursor:pointer;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel)}
.vec{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.vec .hit{pointer-events:stroke;stroke:transparent;fill:none;cursor:move}
.ti{position:absolute;border:1px dashed rgba(47,125,225,.55);background:rgba(47,125,225,.06);cursor:text;border-radius:1px}
.ti:hover{background:rgba(47,125,225,.18);border-style:solid}
.drop{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none;z-index:20}
.zoombar{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:15}
.zoombar .val{font-family:var(--f-mono);font-size:12px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.zoombar .pn{font-family:var(--f-mono);font-size:12px;padding:0 6px;color:var(--ink-2);font-variant-numeric:tabular-nums;border-right:1px solid var(--line);margin-right:2px;height:24px;display:flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:7px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);width:min(520px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:16px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-2)}
.tabs button.on{border-color:var(--accent);color:var(--ink);font-weight:500}
.pad{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;display:block}
.sigtype{height:44px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--panel-2);width:100%;box-sizing:border-box;font-size:15px}
.sigprev{height:110px;background:#fff;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font:600 54px/1 Caveat,cursive;color:#14306b;overflow:hidden;white-space:nowrap}
.mrow{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.mrow .grow{flex:1;display:flex;gap:6px;align-items:center}
.saved-sig{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved-sig img{height:40px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px;cursor:pointer}
.fpbtn{height:28px;display:inline-flex;align-items:center;gap:4px;max-width:200px;padding:0 6px 0 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);cursor:pointer;font-size:13.5px}
.fpbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpbtn svg{width:14px;height:14px;flex:none;font-family:var(--f-ui)}
.fp{position:fixed;z-index:45;width:380px;max-height:min(560px,calc(100vh - 140px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.fp-head{display:flex;gap:6px;padding:10px 10px 6px}
.fp-head input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel-2)}
.fp-chips{display:flex;gap:5px;padding:2px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.fp-chip{flex:none;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:12px;white-space:nowrap}
.fp-chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fp-sub{padding:0 12px 4px;font-size:11px;color:var(--ink-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fp-list{overflow-y:auto;flex:1;min-height:120px;border-top:1px solid var(--line)}
.fp-row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:8px 14px;border:0;background:none;cursor:pointer;text-align:left;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.fp-row:hover,.fp-row:focus-visible{background:var(--hover)}
.fp-row.on{background:var(--accent-soft)}
.fp-name{font-size:19px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fp-meta{font-size:11px;color:var(--ink-2);font-family:var(--f-ui)}
.fp-more{width:100%;padding:12px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer}
.fp-empty{padding:24px 16px;color:var(--ink-2);text-align:center}
.fp-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.fp-foot .btn{flex:1;justify-content:center;height:32px;font-size:12px;padding:0 8px}
@media (max-width:760px){ .fp{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-height:78vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)} }
.mobile-only{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr)}
  .rail{grid-row:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:4px 12px;justify-content:flex-start}
  .rail .sep{width:1px;height:24px;margin:0 4px}
  .tool .tip{display:none}
  .thumbs{position:fixed;left:0;top:0;bottom:0;width:190px;z-index:40;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .viewer{grid-row:4}
  .mobile-only{display:inline-grid}
  .btn .lbl{display:none}
  .top{padding:8px 12px}
  .props{padding:6px 12px}
  .zoombar{right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <button class="ibtn mobile-only" id="tgThumbs" aria-label="Show pages"></button>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Redline</span></div>
    <div class="fname" id="fname"></div>

  const best=faces.map(f=>[Math.abs(styleWeight(f.style)-w)+(/italic|oblique/i.test(f.style)!==!!it?1000:0), f]).sort((a,b)=>a[0]-b[0])[0][1];
  const bytes=new Uint8Array(await (await best.blob()).arrayBuffer());
  if(bytes[0]===0x74&&bytes[1]===0x74&&bytes[2]===0x63&&bytes[3]===0x66) throw new Error('font collection'); // .ttc cannot be embedded directly
  return bytes;
}

  const w=fk['OS/2']?.usWeightClass ? Math.min(900,Math.max(100,Math.round(fk['OS/2'].usWeightClass/100)*100)) : styleWeight(fk.subfamilyName);
  const it=(fk.italicAngle||0)!==0 || /italic|oblique/i.test(fk.subfamilyName||'');
  const ff=new FontFace(fam, bytes.slice().buffer, {weight:String(w), style:it?'italic':'normal'}); await ff.load(); document.fonts.add(ff);
  const F=addFam(fam,{w:[w], it, cat:'sans-serif'}); if(!F.src||F.src==='google'||F.src==='lib') F.upSrc=F.src; F.src='upload';
  F.faces=Object.assign(F.faces||{}, {[w+(it?'i':'')]:bytes}); rebuildKeys(); return fam;
}

const mctx = document.createElement('canvas').getContext('2d');
function cssFont(a, px){ return `${a.italic?'italic ':''}${wt(a)} ${px}px ${famCss(a.font)}`; }
function baseOff(a){ // distance from the text box top to the first baseline, in pt
  mctx.font = cssFont(a,100); const m = mctx.measureText('Hg');
  let asc=m.fontBoundingBoxAscent, desc=m.fontBoundingBoxDescent; if(!asc){asc=90.5;desc=21.2;}

function smooth(pts){
  if(!pts.length) return ''; const f=n=>Math.round(n*10)/10;
  if(pts.length<3) return `M${f(pts[0][0])} ${f(pts[0][1])}` + pts.slice(1).map(p=>` L${f(p[0])} ${f(p[1])}`).join('') + (pts.length===1?` L${f(pts[0][0]+.1)} ${f(pts[0][1])}`:'');
  let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=1;i<pts.length-1;i++){ const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; d+=` Q${f(pts[i][0])} ${f(pts[i][1])} ${f(mx)} ${f(my)}`; }
  const l=pts[pts.length-1]; return d+` L${f(l[0])} ${f(l[1])}`;
}

}

// ---------- loading ----------
async function addSource(bytes, name){
  const key = uid();
  const doc = await pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported:false, fontExtraProperties:true}).promise;
  sources[key] = {bytes, doc, name};
  const out = [];
  for(let i=1;i<=doc.numPages;i++){
    const pp = await doc.getPage(i); const v = pp.view;
    out.push({id:uid(), src:key, index:i-1, w:v[2]-v[0], h:v[3]-v[1], base:pp.rotate||0, rot:0, annots:[]});
  }
  return out;
}
async function openBytes(bytes, name, sample=false){
  $('#loading').hidden=false; $('#loading').textContent='Opening '+name+'…';
  try{
    const newPages = await addSource(bytes, name);
    Object.keys(sources).forEach(k=>{ if(!newPages.some(p=>p.src===k)){ try{sources[k].doc.destroy();}catch(e){} delete sources[k]; }});
    pages = newPages; docName = name; isSample = sample; undoStack=[]; redoStack=[]; selId=null; curPage=0; updUndo();
    for(const k in textCache) delete textCache[k];
    $('#loading').hidden=true;
    zoom = fitZoom(); buildViewer(); buildThumbs(); renderName(); renderProps(); $('#viewer').scrollTop=0;
  }catch(err){
    $('#loading').hidden=true;
    toast(err && err.name==='PasswordException' ? 'This PDF is password-protected. Remove the password and try again.' : 'Could not open this file. Make sure it is a valid PDF.', 4000);
    if(!pages.length) loadSample();
  }
}
function renderName(){
  $('#fname').innerHTML = `<b>${esc(docName)}</b>` + (isSample?'<span class="chip">Sample</span>':'') + ` · ${pages.length} page${pages.length===1?'':'s'}`;
  $('#pcount').textContent = pages.length;
}

// ---------- viewer ----------
let io;
function fitZoom(){
  const vw = $('#viewer').clientWidth - 48; const mw = Math.max(...pages.map(p=>dispDims(p)[0]), 300);

}
function totalRot(p){ return ((p.base+p.rot)%360+360)%360; }
function dispDims(p){ const r=totalRot(p); return (r===90||r===270)?[p.h,p.w]:[p.w,p.h]; }
function buildViewer(){
  const stack=$('#stack'); stack.innerHTML=''; for(const k in pageEls) delete pageEls[k];

  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) renderPage(e.target.dataset.pid); }),{root:$('#viewer'),rootMargin:'600px 0px'});
  const k=K();
  pages.forEach(p=>{
    const [dw,dh]=dispDims(p);
    const pg=document.createElement('div'); pg.className='pg'; pg.dataset.pid=p.id; pg.style.width=dw*k+'px'; pg.style.height=dh*k+'px';
    const pgi=document.createElement('div'); pgi.className='pgi'; pgi.dataset.pid=p.id;
    pgi.style.width=p.w*k+'px'; pgi.style.height=p.h*k+'px'; pgi.style.transform=`translate(-50%,-50%) rotate(${totalRot(p)}deg)`;
    const canvas=document.createElement('canvas'); const ov=document.createElement('div'); ov.className='ov';
    pgi.append(canvas,ov); pg.append(pgi); stack.append(pg);
    pageEls[p.id]={pg,pgi,canvas,ov,rs:0};

  });

}
async function renderPage(pid){

  const k=K(); if(el.rs===k) return; el.rs=k;
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  let scale=k*dpr; const maxPx=16e6; if(p.w*p.h*scale*scale>maxPx) scale=Math.sqrt(maxPx/(p.w*p.h));
  const c=el.canvas; c.width=Math.round(p.w*scale); c.height=Math.round(p.h*scale);
  const ctx=c.getContext('2d',{willReadFrequently:true});
  if(!p.src){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); return; }
  try{
    const pp=await sources[p.src].doc.getPage(p.index+1);
    if(pageEls[pid]!==el) return;
    const vp=pp.getViewport({scale, rotation:0});
    await pp.render({canvasContext:ctx, viewport:vp}).promise;
    if(!textCache[pid]) await loadText(p, pp);

}
async function loadText(p, pp){

    if(Math.abs(tx[1])>0.01 || Math.abs(tx[2])>0.01) continue; // horizontal text only
    const size = Math.hypot(tx[2],tx[3]); if(size<2) continue;
    const st = tc.styles[it.fontName]||{}; let fo=null;
    try{ fo=pp.commonObjs.get(it.fontName); }catch(e){}
    const m = matchFont(fo&&fo.name, {bold:fo&&fo.bold, black:fo&&fo.black, italic:fo&&fo.italic, isMonospace:fo&&fo.isMonospace, isSerifFont:fo&&fo.isSerifFont, fallbackName:(fo&&fo.fallbackName)||st.fontFamily}, it.str);

}

function renderOverlay(p){
  const el=pageEls[p.id]; if(!el) return; const k=K(); const ov=el.ov; let html='';

    const sel = a.id===selId ? ' sel':'';

      let vs=`opacity:${a.opacity??1};`, inner='', cls='an box';
      if(a.type==='rect'||a.type==='ellipse'){ vs+=`border:${a.width*k}px solid ${a.width>0?a.color:'transparent'};background:${a.fill||'transparent'};`; if(a.type==='ellipse') vs+='border-radius:50%;'; }

      else if(a.type==='mark'){ const d=markD(a,true); inner = a.mark==='dot' ? `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" fill="${a.color}"/></svg>`

      const hs = sel&&tool==='select' ? ['nw','n','ne','e','se','s','sw','w'].map(h=>`<div class="hdl" data-h="${h}"></div>`).join('') + (canRot(a.type)?'<div class="rh" data-h="rot" title="Drag to rotate (Shift snaps 15°)"></div>':'') : '';
      html+=`<div class="${cls}${sel}" data-aid="${a.id}" style="${st}"><div class="vis" style="${vs}">${inner}</div>${hs}</div>`;
    } else if(a.type==='text'){
      const st=`left:${a.x*k}px;top:${a.y*k}px;font:${cssFont(a,a.size*k).replace(/"/g,"'")};line-height:1.2;color:${a.color};`;
      html+=`<div dir="auto" class="an txt${sel}" data-aid="${a.id}" style="${st}">${esc(a.text)}${sel&&tool==='select'?'<div class="hdl"></div>':''}</div>`;
    } else if(isVec(a.type)){

      if(sel){ const b=vecBox(a); svg+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="#2f7de1" stroke-width="${1.2/k}" stroke-dasharray="${4/k} ${3/k}"/>`;
        if(tool==='select'){
          if(a.type==='ink') ['nw','ne','se','sw'].forEach(h=>{ const x=h.includes('e')?b.x+b.w:b.x, y=h.includes('s')?b.y+b.h:b.y; html+=`<div class="hdl ep" data-aid="${a.id}" data-h="${h}" style="left:${x*k}px;top:${y*k}px;cursor:${h==='nw'||h==='se'?'nwse':'nesw'}-resize;border-radius:2px"></div>`; });

        } }
    }

    textCache[p.id].forEach((t,i)=>{ if(t.done) return;
      html+=`<div class="ti" data-ti="${i}" title="Click to edit" style="left:${(t.x-1)*k}px;top:${(t.base-t.size*0.86)*k}px;width:${(t.w+2)*k}px;height:${t.size*1.12*k}px"></div>`; });
  }
  ov.innerHTML = `<svg class="vec" viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="none">${svg}</svg>` + html;
  if(editingId){ const [ep]=findAnnot(editingId); if(ep===p) startEdit(editingId,false,true); }
}

// ---------- coordinates ----------
function toLocal(pid, e){
  const p=pageById(pid), el=pageEls[pid], k=K(); const r=el.pgi.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, dx=e.clientX-cx, dy=e.clientY-cy;

  const lx=dx*c+dy*s, ly=-dx*s+dy*c;
  return [(lx + p.w*k/2)/k, (ly + p.h*k/2)/k];
}

// ---------- selection / editing ----------
function select(id){ if(selId===id) return; const prev=selId; selId=id;
  [prev,id].forEach(x=>{ if(!x) return; const [p]=findAnnot(x); if(p) renderOverlay(p); }); renderProps(); }
function startEdit(id, selectAll=false, reattach=false){
  const [p,a]=findAnnot(id); if(!a||a.type!=='text') return;
  editingId=id; const el=pageEls[p.id].ov.querySelector(`[data-aid="${id}"]`); if(!el) return;
  el.querySelector('.hdl')?.remove();

  if(el.contentEditable!=='plaintext-only') el.contentEditable='true';

  const r=document.createRange(); r.selectNodeContents(el); if(!selectAll) r.collapse(false);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  if(reattach) return;
  el.addEventListener('blur', ()=>commitEdit(), {once:true});
  el.addEventListener('keydown', ev=>{ if(ev.key==='Escape'){ ev.preventDefault(); el.blur(); } ev.stopPropagation(); });
  el.addEventListener('input', ()=>{ a.text=el.innerText.replace(/\n$/,''); });
}
function commitEdit(){
  if(!editingId) return; const id=editingId; editingId=null;

  const el=pageEls[p.id]?.ov.querySelector(`[data-aid="${id}"]`);
  if(el) a.text=el.innerText.replace(/\n$/,'');
  if(!a.text.trim()){ p.annots=p.annots.filter(x=>x!==a); if(selId===id) selId=null; }
  renderOverlay(p); renderProps();
}
function deleteSel(){ if(!selId) return; const [p,a]=findAnnot(selId); if(!a) return; snapshot(); p.annots=p.annots.filter(x=>x!==a); selId=null; renderOverlay(p); renderProps(); }
function dupSel(){ if(!selId) return; const [p,a]=findAnnot(selId); if(!a) return; snapshot();
  const b=JSON.parse(JSON.stringify(a)); b.id=uid(); moveAnnot(b,12,12); p.annots.push(b); selId=b.id; renderOverlay(p); renderProps(); }
let clip=null, clipPage=null, pasteN=0;
function copySel(){ const [p,a]=findAnnot(selId); if(!a) return; clip=JSON.stringify(a); clipPage=p.id; pasteN=0; toast('Copied',1200); }
function pasteClip(){ const p=pages[curPage]; if(!p||!clip) return; snapshot(); const b=JSON.parse(clip); b.id=uid();
  if(p.id===clipPage){ pasteN++; moveAnnot(b,12*pasteN,12*pasteN); }
  p.annots.push(b); if(tool!=='select') setTool('select'); selId=b.id; renderOverlay(p); renderProps(); }
function moveAnnot(a,dx,dy){
  if(a.type==='ink') a.pts=a.pts.map(q=>[q[0]+dx,q[1]+dy]);
  else if(a.type==='line'||a.type==='arrow'){ a.x1+=dx;a.y1+=dy;a.x2+=dx;a.y2+=dy; }
  else { a.x+=dx; a.y+=dy; }
}

// ---------- pointer interactions ----------
const viewer=$('#viewer');
viewer.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  if(e.target.closest('[contenteditable]')) return;
  const pgi=e.target.closest('.pgi');
  if(editingId){ commitEdit(); if(tool==='text'&&pgi){ e.preventDefault(); return; } }
  if(!pgi){ if(tool==='select') select(null); return; }
  const pid=pgi.dataset.pid, p=pageById(pid); setCur(pages.indexOf(p));
  const pt=toLocal(pid,e); const aEl=e.target.closest('[data-aid]'); const aid=aEl?.dataset.aid;
  const a = aid ? p.annots.find(x=>x.id===aid) : null;

  if(tool==='place' && pending){ e.preventDefault(); placePending(p, pt); return; }
  if(tool==='stamp'){ e.preventDefault(); placeStamp(p, pt); return; }
  if(tool==='edittext'){
    const ti=e.target.closest('.ti'); if(ti){ e.preventDefault(); replaceText(p, +ti.dataset.ti); return; }
    if(a&&a.type==='text'){ e.preventDefault(); select(a.id); startEdit(a.id); return; }
    return;
  }
  if(tool==='select'){
    const hk=e.target.dataset?.h;
    if(hk && a){ e.preventDefault();
      if(hk==='rot') return dragRotate(e,p,a);

function parseRange(str, n){ // "1-3, 5" -> [0,1,2,4]
  const out=new Set(); for(const part of String(str).split(',')){ const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/); if(!m) continue;
    let a=+m[1], b=m[2]?+m[2]:a; if(a>b) [a,b]=[b,a]; for(let i=Math.max(1,a);i<=Math.min(n,b);i++) out.add(i-1); }
  return [...out].sort((x,y)=>x-y);
}
function modalShell(title, body, okLabel){

  scrim.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}

  document.body.appendChild(scrim); const close=()=>scrim.remove();
  scrim.querySelector('[data-x="cancel"]').onclick=close; scrim.addEventListener('pointerdown',e=>{ if(e.target===scrim) close(); });
  scrim.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } e.stopPropagation(); });

}
const pagesSeg = `<label>Pages</label><div class="row"><div class="seg" data-pg><button data-v="all" class="on">All</button><button data-v="cur">This page</button><button data-v="range">Range</button></div><input type="text" data-rng placeholder="e.g. 1-3, 5" hidden style="width:120px"></div>`;

// ---------- export ----------
async function buildPdf(list=pages){
  const {PDFDocument, StandardFonts, rgb, degrees, BlendMode, LineCapStyle} = PDFLib;
  const out = await PDFDocument.create(); const loaded={}; const fonts={}; const imgs={};
  const col=h=>rgb(...hexRgb(h));
  for(const p of list) if(p.src && !loaded[p.src]) loaded[p.src]=await PDFDocument.load(sources[p.src].bytes,{ignoreEncryption:true});
  if(window.fontkit) out.registerFontkit(window.fontkit);
  // Returns {std, pdf} for built-in fonts, or {faces:[{pdf, fk}]} (one per file; Google fonts come split by character set).
  const embed=async (k, bytes)=>{ if(fonts[k]) return fonts[k]; return fonts[k]={pdf:await out.embedFont(bytes,{subset:true}), fk:window.fontkit.create(bytes)}; };
  const getFont=async a=>{ const F=FAM[a.font]||FAM.Helvetica; const w=nearestW(a.font,wt(a)), it=!!a.italic;
    try{
      if(F.std){ const n=F.std[(w>=600?1:0)+(it?2:0)]; return fonts[n]||(fonts[n]={pdf:await out.embedFont(StandardFonts[n]), std:true}); }
      if(F.faces){ const keys=Object.keys(F.faces); const best=keys.map(k=>[Math.abs(parseInt(k)-w)+(k.endsWith('i')!==it?1000:0),k]).sort((x,y)=>x[0]-y[0])[0]?.[1];
        if(best) return {faces:[await embed('up:'+a.font+best, F.faces[best])]}; }
      if(F.src==='system'){ const bytes=await systemBytes(a.font,w,it); return {faces:[await embed('sys:'+a.font+w+it, bytes)]}; }
      const vk=libVariant(F,w,it);
      if(vk) return {faces:[await embed(F.slug+'-'+vk, await loadFontBytes(F.slug,vk))]};
      if(F.g){ const style=it&&F.it?'italic':'normal'; const faces=[];
        for(const sub of subsetsFor(F, a.text)){ let bytes;
          try{ bytes=await googleFile(a.font, sub, w, style); }catch(e){ if(style==='italic') bytes=await googleFile(a.font, sub, w, 'normal'); else throw e; }
          faces.push(await embed(`g:${a.font}:${sub}:${w}:${style}`, bytes)); }
        return {faces}; }
      if(F.slug){ const v2=F.v.includes('b')&&w>=600?'b':'r'; return {faces:[await embed(F.slug+'-'+v2, await loadFontBytes(F.slug,v2))]}; }
    }catch(e){ console.warn('Font not embeddable, using an image of the text instead:', a.font, e); }
    return {failed:true}; };
  const runsOf=(line, faces)=>{ const out=[];
    for(const ch of line){ const cp=ch.codePointAt(0); const prev=out.length?out[out.length-1][1]:null;
      const f = prev&&prev.fk.hasGlyphForCodePoint(cp) ? prev : faces.find(f=>f.fk.hasGlyphForCodePoint(cp));
      if(!f){ if(cp<=32&&faces.length){ if(prev) out[out.length-1][0]+=ch; else out.push([ch,faces[0]]); continue; } return null; }
      if(prev===f) out[out.length-1][0]+=ch; else out.push([ch,f]); }
    return out; };
  const getImg=async id=>{ if(imgs[id]) return imgs[id]; const im=images[id]; return imgs[id]=(im.kind==='jpg'?await out.embedJpg(im.url):await out.embedPng(im.url)); };
  for(const p of list){
    let page;
    if(p.src){ [page]=await out.copyPages(loaded[p.src],[p.index]); out.addPage(page); } else page=out.addPage([p.w,p.h]);
    page.setRotation(degrees(totalRot(p)));
    const box = p.src ? page.getCropBox() : {x:0,y:0};
    const X=x=>box.x+x, Y=y=>box.y+p.h-y;
    // Bottom-left corner + rotation for a w×h shape centred on the annotation (pdf-lib rotates around that corner).
    const rotBL=(a,w,h)=>{ const cx=X(a.x+a.w/2), cy=Y(a.y+a.h/2), f=-(a.rot||0)*Math.PI/180, c=Math.cos(f), s=Math.sin(f);
      return {x:cx-w/2*c+h/2*s, y:cy-w/2*s-h/2*c, rotate:degrees(-(a.rot||0))}; };
    for(const a of p.annots){
      const op=a.opacity??1;
      if(a.type==='whiteout') page.drawRectangle({x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,color:col(a.fill)});
      else if(a.type==='highlight') page.drawRectangle({x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,color:col(a.color),opacity:0.4,blendMode:BlendMode.Multiply});
      else if(a.type==='rect'){ const sw=a.width, iw=Math.max(0,a.w-sw), ih=Math.max(0,a.h-sw); const o={...rotBL(a,iw,ih),width:iw,height:ih,opacity:op,borderOpacity:op};
        if(a.fill) o.color=col(a.fill); if(sw>0){ o.borderColor=col(a.color); o.borderWidth=sw; } if(a.fill||sw>0) page.drawRectangle(o); }
      else if(a.type==='ellipse'){ const sw=a.width; const o={x:X(a.x+a.w/2),y:Y(a.y+a.h/2),xScale:Math.max(0.1,a.w/2-sw/2),yScale:Math.max(0.1,a.h/2-sw/2),opacity:op,borderOpacity:op};
        if(a.rot) o.rotate=degrees(-a.rot);
        if(a.fill) o.color=col(a.fill); if(sw>0){ o.borderColor=col(a.color); o.borderWidth=sw; } page.drawEllipse(o); }
      else if(isVec(a.type)) page.drawSvgPath(pathD(a),{x:box.x,y:box.y+p.h,borderColor:col(a.color),borderWidth:a.width,borderOpacity:op,borderLineCap:LineCapStyle.Round});
      else if(a.type==='image') page.drawImage(await getImg(a.img),{...rotBL(a,a.w,a.h),width:a.w,height:a.h,opacity:op});
      else if(a.type==='mark'){ const d=markD(a);
        if(a.mark==='dot') page.drawSvgPath(d,{x:box.x,y:box.y+p.h,color:col(a.color),opacity:op});
        else page.drawSvgPath(d,{x:box.x,y:box.y+p.h,borderColor:col(a.color),borderWidth:a.width,borderOpacity:op,borderLineCap:LineCapStyle.Round}); }
      else if(a.type==='text'){
        const lines=a.text.split('\n'), lh=a.size*1.2, b0=a.y+baseOff(a);
        const f=await getFont(a); let ok=!f.failed && !COMPLEX.test(a.text); let lineRuns=null;
        if(ok&&f.std){ try{ lines.forEach(l=>f.pdf.encodeText(l)); }catch(e){ ok=false; } }
        if(ok&&f.faces){ lineRuns=lines.map(l=>runsOf(l,f.faces)); if(lineRuns.some(r=>r===null)) ok=false; }
        if(ok&&f.std) lines.forEach((l,i)=>{ if(l) page.drawText(l,{x:X(a.x),y:Y(b0+i*lh),size:a.size,font:f.pdf,color:col(a.color)}); });
        else if(ok) lineRuns.forEach((runs,i)=>{ let x=X(a.x); for(const [txt,fc] of runs){ page.drawText(txt,{x,y:Y(b0+i*lh),size:a.size,font:fc.pdf,color:col(a.color)}); x+=fc.pdf.widthOfTextAtSize(txt,a.size); } });
        else { // right-to-left scripts or glyphs the font lacks: embed the text as a crisp image
          await fontReady(a, a.text);
          const S=4; mctx.font=cssFont(a,a.size*S); const w=Math.max(...lines.map(l=>mctx.measureText(l).width))/S+2, h=lines.length*lh;
          const c=document.createElement('canvas'); c.width=Math.ceil(w*S); c.height=Math.ceil(h*S); const g=c.getContext('2d');
          g.font=cssFont(a,a.size*S); g.fillStyle=a.color; const rtl=/[\u0590-\u08FF]/.test(a.text); g.direction=rtl?'rtl':'ltr'; g.textAlign=rtl?'right':'left'; lines.forEach((l,i)=>g.fillText(l,rtl?c.width:0,(baseOff(a)+i*lh)*S));
          const im=await out.embedPng(c.toDataURL('image/png')); page.drawImage(im,{x:X(a.x),y:Y(a.y+h),width:w,height:h});
        }
      }
    }
  }
  out.setProducer('Redline PDF Editor'); out.setModificationDate(new Date());
  return await out.save();
}
let saving=false;
async function download(){
  if(saving) return; commitEdit();
  if(pages.some(p=>p.annots.some(a=>a.type==='text'&&FAM[a.font]?.src==='system'))) loadSystemFonts().catch(()=>{});
  saving=true; const b=$('#bSave'); const lbl=b.querySelector('.lbl'); const old=lbl.textContent; lbl.textContent='Preparing…';
  try{
    const bytes=await buildPdf(); const name=baseName()+'-edited.pdf';
    await saveBlob(new Blob([bytes],{type:'application/pdf'}), name);
  }catch(err){ console.error(err); toast('Could not build the PDF: '+(err?.message||'unknown error'),4500); }
  finally{ saving=false; lbl.textContent=old; }
}
const baseName=()=>docName.replace(/\.pdf$/i,'');
async function saveBlob(blob, name){
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:name, data:blob}); toast('Saved '+name); }
    catch(err){ if(err?.code==='declined') toast('Download cancelled.'); else if(err?.code==='rate_limited') toast('A save prompt is already open.'); else toast('Saving is not available in this view.'); } return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Downloading '+name);
}
async function exportPagePdf(p, i){
  commitEdit(); toast('Preparing page '+(i+1)+'…',1500);
  try{ const bytes=await buildPdf([p]); await saveBlob(new Blob([bytes],{type:'application/pdf'}), `${baseName()}-page-${i+1}.pdf`); }
  catch(err){ console.error(err); toast('Could not export this page: '+(err?.message||'unknown error'),4500); }
}
async function exportPagePng(p, i){
  commitEdit(); toast('Rendering page '+(i+1)+'…',1500);
  try{ const bytes=await buildPdf([p]); const doc=await pdfjsLib.getDocument({data:bytes, isEvalSupported:false}).promise; const pp=await doc.getPage(1);
    const vp=pp.getViewport({scale:200/72}); const c=canvasOf(Math.round(vp.width),Math.round(vp.height)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    await pp.render({canvasContext:g, viewport:vp}).promise; doc.destroy();
    const blob=await new Promise(r=>c.toBlob(r,'image/png')); await saveBlob(blob, `${baseName()}-page-${i+1}.png`); }
  catch(err){ console.error(err); toast('Could not render this page: '+(err?.message||'unknown error'),4500); }
}

document.addEventListener('keydown', e=>{
  if(e.target.closest?.('input,select,textarea,[contenteditable]')) return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); download(); return; }
  if(mod&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel(); return; }
  if(mod&&e.key.toLowerCase()==='c'&&selId){ if(getSelection().toString()) return; e.preventDefault(); copySel(); return; }
  if(mod&&e.key.toLowerCase()==='x'&&selId){ e.preventDefault(); copySel(); deleteSel(); return; }
  if(mod&&e.key.toLowerCase()==='v'&&clip){ e.preventDefault(); pasteClip(); return; }
  if(mod&&(e.key==='='||e.key==='+')){ e.preventDefault(); setZoom(zoom*1.2); return; }
  if(mod&&e.key==='-'){ e.preventDefault(); setZoom(zoom/1.2); return; }
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){ if(selId){ e.preventDefault(); deleteSel(); } return; }
  if(e.key==='Escape'){ if(document.querySelector('.scrim')) return; pending=null; select(null); setTool('select'); return; }
  if(selId && e.key.startsWith('Arrow')){ e.preventDefault(); const [p,a]=findAnnot(selId); const s=e.shiftKey?10:1; snapshot();
    moveAnnot(a, e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0, e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0); renderOverlay(p); return; }
    if(selId && (e.key===']'||e.key==='[')){ e.preventDefault(); layer(e.key===']'); return; }
  const m={v:'select',e:'edittext',t:'text',d:'draw',h:'highlight',w:'whiteout',r:'rect',o:'ellipse',l:'line',a:'arrow',i:'image',s:'sign',k:'stamp'}[e.key.toLowerCase()];
  if(m) setTool(m);
});

async function makeSample(){
  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const d=await PDFDocument.create(); d.setTitle('Studio Rental Agreement'); d.setAuthor('Lumen Studios');
  const H=await d.embedFont(StandardFonts.Helvetica), HB=await d.embedFont(StandardFonts.HelveticaBold), T=await d.embedFont(StandardFonts.TimesRoman), TB=await d.embedFont(StandardFonts.TimesRomanBold);
  let MB=HB, PF=HB, LA=H, LB=HB; // brand fonts when the font files are reachable, built-in fonts otherwise
  try{ d.registerFontkit(window.fontkit);
    [MB,PF,LA,LB] = await Promise.all([['montserrat','b'],['playfair-display','b'],['lato','r'],['lato','b']].map(async ([f,v])=>d.embedFont(await loadFontBytes(f,v),{subset:true}))); }catch(e){ MB=HB; PF=HB; LA=H; LB=HB; }
  const ink=rgb(.11,.13,.15), mute=rgb(.38,.42,.46), red=rgb(.77,.22,.17), rule=rgb(.8,.82,.85);
  const W=612, Ht=792; const t=(pg,s,x,y,size,f,c=ink)=>pg.drawText(s,{x,y:Ht-y,size,font:f,color:c});
  const p1=d.addPage([W,Ht]);
  t(p1,'LUMEN STUDIOS',56,64,10,MB,red); t(p1,'14 Canal Road, Lahore · bookings@lumenstudios.pk',56,78,8.5,H,mute);
  t(p1,'Agreement No. SR-2026-0418',400,64,9,H,mute); t(p1,'Date: October 2, 2026',400,78,9,H,mute);
  p1.drawLine({start:{x:56,y:Ht-94},end:{x:556,y:Ht-94},thickness:.8,color:rule});
  t(p1,'Studio Rental Agreement',56,132,26,PF);
  const para=(pg,lines,y,size=11.5,lh=16)=>{ lines.forEach((l,i)=>t(pg,l,56,y+i*lh,size,T)); return y+lines.length*lh; };
  let y=para(p1,['This agreement is made between Lumen Studios LLC (the “Studio”) and Amina Siddiqui','(the “Renter”) for the use of Stage B, its lighting grid and the adjoining green room.'],164);
  const sec=(pg,s,y)=>{ t(pg,s,56,y,12,TB); return y+18; };
  y=sec(p1,'1. Rental period',y+16);
  y=para(p1,['From October 14, 2026 at 08:00 to October 16, 2026 at 20:00, a total of 60 hours.','Load-in begins one hour before the start time; overtime is billed at PKR 4,500 per hour.'],y);
  y=sec(p1,'2. Fees',y+16);
  const rows=[['Stage B day rate × 3 days','PKR 165,000'],['Lighting package (Arri SkyPanel × 4)','PKR 42,000'],['Security deposit (refundable)','PKR 50,000']];
  rows.forEach(([a,b])=>{ t(p1,a,72,y,11,LA); t(p1,b,556-LA.widthOfTextAtSize(b,11),y,11,LA); p1.drawLine({start:{x:72,y:Ht-y-6},end:{x:556,y:Ht-y-6},thickness:.5,color:rule}); y+=22; });
  t(p1,'Total due',72,y+2,11.5,LB); t(p1,'PKR 257,000',556-LB.widthOfTextAtSize('PKR 257,000',11.5),y+2,11.5,LB); y+=30;
  y=sec(p1,'3. Conditions',y+6);
  y=para(p1,['a) The Renter returns the stage swept and the cyc wall unpainted unless agreed in writing.','b) No open flame, haze machines need prior approval from the Studio manager.','c) The deposit is refunded within 7 working days after the equipment check.','d) Cancellation within 72 hours of the start time forfeits 50% of the stage fee.'],y);
  const sy=Ht-120;
  [[56,'Renter signature','Amina Siddiqui'],[330,'Studio representative','Bilal Ahmed, Studio Manager']].forEach(([x,l,n])=>{
    p1.drawLine({start:{x,y:Ht-sy},end:{x:x+226,y:Ht-sy},thickness:.8,color:ink}); t(p1,l,x,sy+14,9,HB,mute); t(p1,n,x,sy+27,9,H,mute); t(p1,'Date: ____________',x,sy+42,9,H,mute); });
  t(p1,'Page 1 of 2',W/2-22,Ht-30,8,H,mute);
  const p2=d.addPage([W,Ht]);
  t(p2,'LUMEN STUDIOS',56,64,10,MB,red); t(p2,'Agreement No. SR-2026-0418',400,64,9,H,mute);
  p2.drawLine({start:{x:56,y:Ht-80},end:{x:556,y:Ht-80},thickness:.8,color:rule});
  t(p2,'Schedule A — Equipment List',56,118,22,PF);
  let yy=152; [['Item',56],['Qty',360],['Condition at check-out',410]].forEach(([s,x])=>t(p2,s,x,yy,9.5,HB,mute)); yy+=8;
  p2.drawLine({start:{x:56,y:Ht-yy},end:{x:556,y:Ht-yy},thickness:.8,color:ink}); yy+=18;
  [['Arri SkyPanel S60-C','4','Good'],['Aputure 600d with Light Dome','2','Good'],['C-stand, 40"','10','2 with worn knuckles'],['Sandbag, 15 lb','16','Good'],['Matthews 12×12 frame + silk','1','Small tear, taped'],['Apple boxes (full set)','3','Good'],['Extension cable, 50 ft','8','Good']].forEach(r=>{
    t(p2,r[0],56,yy,11,T); t(p2,r[1],360,yy,11,T); t(p2,r[2],410,yy,11,T); p2.drawLine({start:{x:56,y:Ht-yy-7},end:{x:556,y:Ht-yy-7},thickness:.5,color:rule}); yy+=24; });
  t(p2,'Checked out by: ________________________     Checked in by: ________________________',56,yy+30,10,H,mute);
  t(p2,'Page 2 of 2',W/2-22,Ht-30,8,H,mute);
  return await d.save();
}
async function loadSample(){ openBytes(await makeSample(), 'studio-rental-agreement.pdf', true); }

// ---------- boot ----------
function boot(){
  $('#bUndo').innerHTML=ic(I.undo); $('#bRedo').innerHTML=ic(I.redo); $('#iOpen').innerHTML=ic(I.open); $('#iSave').innerHTML=ic(I.save);
  $('#zIn').innerHTML=ic(I.plus); $('#zOut').innerHTML=ic(I.minus); $('#zFit').innerHTML=ic(I.fit); $('#tgThumbs').innerHTML=ic(I.pages);
  $('#tgThumbs').onclick=()=>toggleThumbs();
  if(innerWidth<=760) $('#thumbs').hidden=true;
  renderRail(); renderProps(); updUndo();
  if(!window.pdfjsLib||!window.PDFLib){ $('#loading').textContent='The PDF engine could not load. Check your connection and reload.'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  buildFp();
  try{ navigator.permissions?.query({name:'local-fonts'}).then(st=>{ if(st.state==='granted') loadSystemFonts().catch(()=>{}); }).catch(()=>{}); }catch(e){}
  loadCatalog().finally(loadSample);
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ $('#thumbs').hidden = innerWidth<=760; },150); });
}
boot();
})();
</script>
