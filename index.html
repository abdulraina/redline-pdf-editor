<title>Redline PDF Editor</title>
<meta name="description" content="Free online PDF editor. Edit existing text with automatic font matching, add text, draw, highlight, sign and rearrange pages. Files stay in your browser.">
<meta name="theme-color" content="#c4382c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600;700&display=swap">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Gelasio:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Slab:wght@400;700&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;700&family=Pacifico&family=Great+Vibes&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
/* Layout: proofing desk — tool rail | page strip | scrolling paper stack, red proofmark accent */
:root{
  --bg:#e9ecef; --panel:#f7f8f9; --panel-2:#ffffff; --line:#d3d8dd; --ink:#1b2127; --ink-2:#5b6670;
  --desk:#dde1e5; --accent:#c4382c; --accent-ink:#ffffff; --accent-soft:#f6dedb; --hover:#e6e9ec; --ok:#1d7a46; --shadow:0 1px 2px rgba(20,28,36,.12),0 6px 20px rgba(20,28,36,.10);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171a; --panel:#1b1f23; --panel-2:#22272c; --line:#2f363d; --ink:#e4e7ea; --ink-2:#9aa4ad;
  --desk:#101214; --accent:#ef6a5d; --accent-ink:#1a0d0b; --accent-soft:#3a201d; --hover:#272d33; --ok:#5cc98b; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --panel:#1b1f23; --panel-2:#22272c; --line:#2f363d; --ink:#e4e7ea; --ink-2:#9aa4ad;
  --desk:#101214; --accent:#ef6a5d; --accent-ink:#1a0d0b; --accent-soft:#3a201d; --hover:#272d33; --ok:#5cc98b; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--f-ui);overflow:hidden}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:52px 172px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);}
/* header */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand .mark{width:22px;height:26px;border-radius:2px;background:var(--panel-2);border:1.5px solid var(--ink);position:relative}
.brand .mark::after{content:"";position:absolute;left:3px;right:3px;top:11px;height:2px;background:var(--accent);transform:rotate(-8deg)}
.fname{color:var(--ink-2);font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.fname b{color:var(--ink);font-weight:500}
.chip{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--hover)}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
.ibtn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* property bar */
.props{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:45px;scrollbar-width:thin}
.props .grp{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);flex:none}
.props .grp:last-child{border-right:0}
.props label.cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin-right:2px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--accent) 45% 55%,transparent 55%),var(--panel-2)}
input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.props select,.props input[type=number]{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 6px}
.props input[type=number]{width:56px;font-family:var(--f-mono)}
.tog{height:28px;min-width:28px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:600}
.tog.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.props input[type=range]{width:80px;accent-color:var(--accent)}
.hint{color:var(--ink-2);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hint .det b{color:var(--ink);font-weight:500}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--hover);color:var(--ink)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
/* tool rail */
.rail{grid-row:3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.rail .sep{width:24px;height:1px;background:var(--line);margin:4px 0}
.tool{width:38px;height:38px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--panel);padding:4px 8px;border-radius:4px;white-space:nowrap;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.tool .tip kbd{font-family:var(--f-mono);opacity:.7;margin-left:6px}
.tool:hover .tip{opacity:1}
/* thumbnails */
.thumbs{grid-row:3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.thumbs .head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.pageops{display:flex;flex-wrap:wrap;gap:0;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.pageops .ibtn{width:30px;height:30px}
.tlist{overflow-y:auto;padding:12px 0 24px;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1}
.th{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px;border-radius:6px;border:2px solid transparent}
.th.cur{border-color:var(--accent)}
.th.drop-before{box-shadow:0 -3px 0 var(--accent)}
.th.drop-after{box-shadow:0 3px 0 var(--accent)}
.th canvas{display:block;background:#fff;box-shadow:var(--shadow);max-width:120px}
.th span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* viewer */
.viewer{grid-row:3;background:var(--desk);overflow:auto;position:relative;min-width:0}
.stack{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px 80px;min-width:min-content}
.pg{position:relative;flex:none}
.pgi{position:absolute;left:50%;top:50%;background:#fff;box-shadow:var(--shadow)}
.pgi canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;overflow:hidden}
.viewer[data-tool="draw"] .ov,.viewer[data-tool="rect"] .ov,.viewer[data-tool="ellipse"] .ov,.viewer[data-tool="line"] .ov,.viewer[data-tool="arrow"] .ov,.viewer[data-tool="highlight"] .ov,.viewer[data-tool="whiteout"] .ov{cursor:crosshair;touch-action:none}
.viewer[data-tool="text"] .ov{cursor:text}
.viewer[data-tool="place"] .ov{cursor:copy;touch-action:none}
.an{position:absolute;box-sizing:border-box}
.an.txt{white-space:pre;line-height:1.2;padding:0;outline:none;min-width:4px;cursor:move}
.an.txt[contenteditable]{cursor:text;outline:1px dashed var(--accent);outline-offset:2px;background:rgba(255,255,255,.35)}
.an.txt[contenteditable]:empty::before{content:"Type here";color:#9aa3ab}
.an.hl{mix-blend-mode:multiply}
.an img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.viewer[data-tool="select"] .an{cursor:move}
.an.sel{outline:1.5px solid #2f7de1;outline-offset:2px}
.hdl{position:absolute;right:-7px;bottom:-7px;width:10px;height:10px;background:#fff;border:1.5px solid #2f7de1;border-radius:2px;cursor:nwse-resize;touch-action:none}
.vec{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.vec .hit{pointer-events:stroke;stroke:transparent;fill:none;cursor:move}
.ti{position:absolute;border:1px dashed rgba(47,125,225,.55);background:rgba(47,125,225,.06);cursor:text;border-radius:1px}
.ti:hover{background:rgba(47,125,225,.18);border-style:solid}
.drop{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none;z-index:20}
.zoombar{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:15}
.zoombar .val{font-family:var(--f-mono);font-size:12px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.zoombar .pn{font-family:var(--f-mono);font-size:12px;padding:0 6px;color:var(--ink-2);font-variant-numeric:tabular-nums;border-right:1px solid var(--line);margin-right:2px;height:24px;display:flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:7px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);width:min(520px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:16px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-2)}
.tabs button.on{border-color:var(--accent);color:var(--ink);font-weight:500}
.pad{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;display:block}
.sigtype{height:44px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--panel-2);width:100%;box-sizing:border-box;font-size:15px}
.sigprev{height:110px;background:#fff;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font:600 54px/1 Caveat,cursive;color:#14306b;overflow:hidden;white-space:nowrap}
.mrow{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.mrow .grow{flex:1;display:flex;gap:6px;align-items:center}
.saved-sig{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved-sig img{height:40px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px;cursor:pointer}
.mobile-only{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr)}
  .rail{grid-row:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:4px 12px;justify-content:flex-start}
  .rail .sep{width:1px;height:24px;margin:0 4px}
  .tool .tip{display:none}
  .thumbs{position:fixed;left:0;top:0;bottom:0;width:190px;z-index:40;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .viewer{grid-row:4}
  .mobile-only{display:inline-grid}
  .btn .lbl{display:none}
  .top{padding:8px 12px}
  .props{padding:6px 12px}
  .zoombar{right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <button class="ibtn mobile-only" id="tgThumbs" aria-label="Show pages"></button>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Redline</span></div>
    <div class="fname" id="fname"></div>
    <button class="ibtn" id="bUndo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)"></button>
    <button class="ibtn" id="bRedo" aria-label="Redo (Ctrl+Y)" title="Redo (Ctrl+Y)"></button>
    <button class="btn" id="bOpen"><span id="iOpen"></span><span class="lbl">Open PDF</span></button>
    <button class="btn primary" id="bSave"><span id="iSave"></span><span class="lbl">Download</span></button>
    <input type="file" id="fOpen" accept="application/pdf,.pdf" hidden>
    <input type="file" id="fMerge" accept="application/pdf,.pdf" hidden>
    <input type="file" id="fImg" accept="image/*" hidden>
  </header>
  <div class="props" id="props"></div>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <aside class="thumbs" id="thumbs">
    <div class="head"><span>Pages</span><span id="pcount" style="font-family:var(--f-mono)"></span></div>
    <div class="pageops" id="pageops"></div>
    <div class="tlist" id="tlist"></div>
  </aside>
  <main class="viewer" id="viewer" data-tool="select"><div class="stack" id="stack"></div><div class="loading" id="loading">Loading editor…</div></main>
</div>
<div class="zoombar" id="zoombar">
  <span class="pn" id="pnum">1 / 1</span>
  <button class="ibtn" id="zOut" aria-label="Zoom out"></button>
  <span class="val" id="zVal">100%</span>
  <button class="ibtn" id="zIn" aria-label="Zoom in"></button>
  <button class="ibtn" id="zFit" aria-label="Fit width" title="Fit width"></button>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script>
(() => {

  whiteout:'M3 17l8.5-9.5 7.5 6.5-5 5.5H8zM7.5 12.5l7 6M3 22h18', image:'M4 5h16v14H4zM4 16l5-5 4 4 2-2 5 5M15.5 9h.01',
  sign:'M3 16c3-7 5.5-9.5 6.5-7.5s-2.5 8 0 8 3-5 5-5 .5 4 3 4 2-2 3.5-2M3 21h18',

viewer.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  if(e.target.closest('[contenteditable]')) return;
  const pgi=e.target.closest('.pgi');
  if(editingId){ commitEdit(); if(tool==='text'&&pgi){ e.preventDefault(); return; } }
  if(!pgi){ if(tool==='select') select(null); return; }
  const pid=pgi.dataset.pid, p=pageById(pid); setCur(pages.indexOf(p));
  const pt=toLocal(pid,e); const aEl=e.target.closest('[data-aid]'); const aid=aEl?.dataset.aid;
  const a = aid ? p.annots.find(x=>x.id===aid) : null;

  if(tool==='place' && pending){ e.preventDefault(); placePending(p, pt); return; }
  if(tool==='edittext'){
    const ti=e.target.closest('.ti'); if(ti){ e.preventDefault(); replaceText(p, +ti.dataset.ti); return; }
    if(a&&a.type==='text'){ e.preventDefault(); select(a.id); startEdit(a.id); return; }
    return;
  }
  if(tool==='select'){
    if(e.target.classList.contains('hdl') && a){ e.preventDefault(); return dragResize(e,p,a,pt); }
    if(a){ e.preventDefault(); select(a.id); return dragMove(e,p,a,pt); }
    select(null); return;
  }
  if(tool==='text'){
    e.preventDefault();
    if(a&&a.type==='text'){ select(a.id); startEdit(a.id); return; }
    snapshot();
    const t={id:uid(), type:'text', text:'', x:pt[0], y:pt[1], size:props.size, font:props.font, bold:props.bold, italic:props.italic, color:props.color};
    t.y -= baseOff(t)*0.75; p.annots.push(t); selId=t.id; renderOverlay(p); renderProps(); startEdit(t.id);
    // remove the undo entry if nothing gets typed
    const n=undoStack.length; const chk=()=>{ if(!p.annots.includes(t) && undoStack.length===n) { undoStack.pop(); updUndo(); } };
    setTimeout(()=>{ const el=pageEls[p.id]?.ov.querySelector(`[data-aid="${t.id}"]`); el?.addEventListener('blur',()=>setTimeout(chk),{once:true}); });
    return;
  }
  if(tool==='draw'){ e.preventDefault(); return dragInk(e,p,pt); }
  if(['rect','ellipse','highlight','whiteout'].includes(tool)){ e.preventDefault(); return dragBox(e,p,pt); }
  if(tool==='line'||tool==='arrow'){ e.preventDefault(); return dragLine(e,p,pt); }
});
viewer.addEventListener('dblclick', e=>{
  const aEl=e.target.closest('[data-aid]'); if(!aEl||tool!=='select') return;
  const [,a]=findAnnot(aEl.dataset.aid); if(a&&a.type==='text'){ select(a.id); startEdit(a.id); }
});
function track(e, onMove, onUp){
  const mv=ev=>{ ev.preventDefault(); onMove(ev); }; const up=ev=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); onUp(ev); };
  window.addEventListener('pointermove',mv,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
function dragMove(e,p,a,pt){
  let last=pt, moved=false;
  track(e, ev=>{ const q=toLocal(p.id,ev); const dx=q[0]-last[0], dy=q[1]-last[1]; if(!moved&&Math.hypot(q[0]-pt[0],q[1]-pt[1])<1.5) return;
    if(!moved){ snapshot(); moved=true; } moveAnnot(a,dx,dy); last=q; renderOverlay(p); }, ()=>{});
}
function dragResize(e,p,a,pt){
  snapshot(); const k=K();
  if(a.type==='text'){
    const el=pageEls[p.id].ov.querySelector(`[data-aid="${a.id}"]`); const w0=el.offsetWidth/k, s0=a.size;
    track(e, ev=>{ const q=toLocal(p.id,ev); const nw=Math.max(4, w0+(q[0]-pt[0])); a.size=Math.max(4, Math.round(s0*nw/w0*2)/2); renderOverlay(p); }, ()=>renderProps());
    return;
  }
  const w0=a.w, h0=a.h, ar=w0/h0;
  track(e, ev=>{ const q=toLocal(p.id,ev); a.w=Math.max(4,w0+q[0]-pt[0]); a.h=a.type==='image'&&!ev.shiftKey? a.w/ar : Math.max(4,h0+q[1]-pt[1]); renderOverlay(p); }, ()=>{});
}
function dragInk(e,p,pt){
  const a={id:uid(), type:'ink', pts:[pt], color:props.color, width:props.width, opacity:props.opacity};
  const ov=pageEls[p.id].ov; const svg=ov.querySelector('svg.vec');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('stroke',a.color); path.setAttribute('stroke-width',a.width); path.setAttribute('fill','none'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round'); path.setAttribute('opacity',a.opacity);
  svg.appendChild(path); path.setAttribute('d',smooth(a.pts));
  track(e, ev=>{ const evs=ev.getCoalescedEvents?ev.getCoalescedEvents():[ev]; for(const ce of (evs.length?evs:[ev])){ const q=toLocal(p.id,ce); const l=a.pts[a.pts.length-1]; if(Math.hypot(q[0]-l[0],q[1]-l[1])>0.6) a.pts.push(q); } path.setAttribute('d',smooth(a.pts)); },
    ()=>{ snapshot(); a.pts=simplify(a.pts,0.35); p.annots.push(a); renderOverlay(p); });
}
function simplify(pts,eps){ // Ramer–Douglas–Peucker
  if(pts.length<3) return pts;
  const dist=(p,a,b)=>{ const dx=b[0]-a[0],dy=b[1]-a[1]; const L=dx*dx+dy*dy; if(!L) return Math.hypot(p[0]-a[0],p[1]-a[1]); let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); };
  let mx=0,idx=0; for(let i=1;i<pts.length-1;i++){ const d=dist(pts[i],pts[0],pts[pts.length-1]); if(d>mx){mx=d;idx=i;} }
  if(mx>eps){ const l=simplify(pts.slice(0,idx+1),eps), r=simplify(pts.slice(idx),eps); return l.slice(0,-1).concat(r); }
  return [pts[0],pts[pts.length-1]];
}
function dragBox(e,p,pt){
  const t=tool; let a={id:uid(), type:t, x:pt[0], y:pt[1], w:0, h:0};
  if(t==='rect'||t==='ellipse'){ Object.assign(a,{color:props.color,width:props.width,fill:props.fill,opacity:props.opacity}); }
  if(t==='highlight') a.color=props.hl;
  if(t==='whiteout') a.fill=props.wo;
  p.annots.push(a); let started=false;
  track(e, ev=>{ const q=toLocal(p.id,ev); a.x=Math.min(pt[0],q[0]); a.y=Math.min(pt[1],q[1]); a.w=Math.abs(q[0]-pt[0]); a.h=Math.abs(q[1]-pt[1]); started=true; renderOverlay(p); },
    ()=>{ p.annots=p.annots.filter(x=>x!==a); if(!started||a.w<3||a.h<3){ renderOverlay(p); return; } snapshot(); p.annots.push(a); renderOverlay(p); });
}
function dragLine(e,p,pt){
  const a={id:uid(), type:tool, x1:pt[0], y1:pt[1], x2:pt[0], y2:pt[1], color:props.color, width:props.width, opacity:props.opacity};
  p.annots.push(a);
  track(e, ev=>{ let q=toLocal(p.id,ev); if(ev.shiftKey){ const ang=Math.round(Math.atan2(q[1]-pt[1],q[0]-pt[0])/(Math.PI/4))*(Math.PI/4); const L=Math.hypot(q[0]-pt[0],q[1]-pt[1]); q=[pt[0]+L*Math.cos(ang),pt[1]+L*Math.sin(ang)]; } a.x2=q[0]; a.y2=q[1]; renderOverlay(p); },
    ()=>{ p.annots=p.annots.filter(x=>x!==a); if(Math.hypot(a.x2-a.x1,a.y2-a.y1)<3){ renderOverlay(p); return; } snapshot(); p.annots.push(a); renderOverlay(p); });
}

// ---------- edit existing text ----------
function sampleBg(p, x, y){
  const el=pageEls[p.id]; const c=el.canvas; if(!c.width) return '#ffffff';
  const sc=c.width/p.w; const ctx=c.getContext('2d');
  const pts=[[x-2,y],[x,y-1],[x-2,y+2]];
  try{ let r=0,g=0,b=0,n=0; for(const [px,py] of pts){ const d=ctx.getImageData(Math.max(0,Math.round(px*sc)),Math.max(0,Math.round(py*sc)),1,1).data; r+=d[0];g+=d[1];b+=d[2];n++; }
    const h=v=>Math.round(v/n).toString(16).padStart(2,'0'); return '#'+h(r)+h(g)+h(b); }catch(e){ return '#ffffff'; }
}
function sampleInk(p, t, bg){ // dominant text color inside the item's box
  const c=pageEls[p.id].canvas; if(!c.width) return '#111111';
  const sc=c.width/p.w; const x=Math.max(0,Math.floor(t.x*sc)), y=Math.max(0,Math.floor((t.base-t.size*0.8)*sc));
  const w=Math.max(1,Math.min(c.width-x,Math.ceil(t.w*sc))), h=Math.max(1,Math.min(c.height-y,Math.ceil(t.size*1.0*sc)));
  try{
    const d=c.getContext('2d').getImageData(x,y,w,h).data; const [br,bgc,bb]=hexRgb(bg).map(v=>v*255); const px=[];
    const step = Math.max(1, Math.floor(d.length/4/40000));
    for(let i=0;i<d.length;i+=4*step){ const dist=Math.abs(d[i]-br)+Math.abs(d[i+1]-bgc)+Math.abs(d[i+2]-bb); if(dist>90) px.push([dist,d[i],d[i+1],d[i+2]]); }
    if(!px.length) return '#111111';
    px.sort((a,b)=>b[0]-a[0]); const top=px.slice(0,Math.max(1,Math.ceil(px.length*0.3)));
    const avg=j=>Math.round(top.reduce((s,q)=>s+q[j],0)/top.length);
    const hx=v=>v.toString(16).padStart(2,'0'); return '#'+hx(avg(1))+hx(avg(2))+hx(avg(3));
  }catch(e){ return '#111111'; }
}
const localFaces = {};
function registerFace(name, vk){ // load the bundled TTF so screen and exported PDF use the same file
  const F=FONTS[name]; if(!F||!F.slug) return Promise.resolve();
  const k=F.slug+'-'+vk; if(localFaces[k]) return localFaces[k];
  return localFaces[k]=(async()=>{ try{ const bytes=await loadFontBytes(F.slug,vk);
    const ff=new FontFace(name, bytes.slice().buffer, {weight:vk.includes('b')?'700':'400', style:vk.includes('i')?'italic':'normal'});
    await ff.load(); document.fonts.add(ff); }catch(e){} })();
}
const fontReady = (a, txt) => { const F=FONTS[a.font];
  const reg = F&&F.slug ? registerFace(a.font, variantKey(F,a.bold,a.italic)) : Promise.resolve();
  return Promise.race([reg.then(()=>document.fonts.load(cssFont(a,100), txt||'Hg')).catch(()=>{}), new Promise(r=>setTimeout(r,2500))]); };
async function replaceText(p, i){
  const t=textCache[p.id][i]; if(!t||t.done) return; t.done=true;
  const top=t.base-t.size*0.86, h=t.size*1.12; const bg=sampleBg(p,t.x-1,top+1);
  const a={id:uid(), type:'text', text:t.str, x:t.x, y:0, size:Math.round(t.size*10)/10, font:t.font, bold:t.bold, italic:t.italic,
    color:sampleInk(p,t,bg), srcFont:t.src, exact:t.exact};
  await fontReady(a, t.str);
  snapshot();
  p.annots.push({id:uid(), type:'whiteout', x:t.x-1, y:top, w:t.w+2, h, fill:bg});
  a.y = t.base - baseOff(a); p.annots.push(a); selId=a.id;
  renderOverlay(p); renderProps(); startEdit(a.id, true);
}

// ---------- images & signatures ----------
function loadImage(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const max=2200; let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
    const jpg=/jpe?g/i.test(file.type); res({url:c.toDataURL(jpg?'image/jpeg':'image/png',0.92), kind:jpg?'jpg':'png', w, h}); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
function beginPlace(imgId, w, h, label){
  pending={img:imgId, w, h}; setTool('place'); toast(label||'Click on a page to place it', 2200);
}
function placePending(p, pt){
  snapshot(); const {img,w,h}=pending;
  const a={id:uid(), type:'image', img, x:pt[0]-w/2, y:pt[1]-h/2, w, h, opacity:1};
  p.annots.push(a); pending=null; selId=a.id; setTool('select'); renderOverlay(p); renderProps();
}
$('#fImg').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const im=await loadImage(f); const id=uid(); images[id]={url:im.url, kind:im.kind};
    const p=pages[curPage]; const maxW=Math.min(p.w*0.5, im.w*0.75); const w=maxW, h=w*im.h/im.w; beginPlace(id,w,h,'Click on a page to place the image'); }
  catch(err){ toast('Could not read that image file.'); setTool('select'); }
});

function signatureModal(){
  const scrim=document.createElement('div'); scrim.className='scrim';
  scrim.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sigH">
    <h2 id="sigH">Add your signature</h2>
    ${lastSig?`<div class="saved-sig"><span class="hint">Use saved:</span><img id="sigSaved" src="${images[lastSig.id].url}" alt="Saved signature"></div>`:''}
    <div class="tabs"><button class="on" data-t="draw">Draw</button><button data-t="type">Type</button></div>
    <div id="sigDraw"><canvas class="pad" id="sigPad"></canvas></div>
    <div id="sigType" hidden><input class="sigtype" id="sigName" placeholder="Your full name" value="Amina Siddiqui"><div class="sigprev" id="sigPrev" style="margin-top:8px">Amina Siddiqui</div></div>
    <div class="mrow"><div class="grow"><span class="hint">Ink</span>${['#111111','#14306b','#1f5fbf'].map((c,i)=>`<button class="sw${i===1?' on':''}" data-ink="${c}" style="background:${c}" aria-label="Ink ${c}"></button>`).join('')}<button class="btn" id="sigClear" style="margin-left:6px">Clear</button></div>
      <button class="btn" id="sigCancel">Cancel</button><button class="btn primary" id="sigOk">Place signature</button></div></div>`;
  document.body.appendChild(scrim);
  let ink='#14306b', mode='draw', strokes=[], cur=null;
  const pad=scrim.querySelector('#sigPad'); const dpr=window.devicePixelRatio||1;
  const fit=()=>{ const r=pad.getBoundingClientRect(); pad.width=r.width*dpr; pad.height=r.height*dpr; redraw(); };
  const redraw=()=>{ const c=pad.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,pad.width,pad.height);
    c.strokeStyle='#d6dbe0'; c.lineWidth=1; c.beginPath(); c.moveTo(20,140); c.lineTo(pad.width/dpr-20,140); c.stroke();
    c.strokeStyle=ink; c.lineWidth=2.6; c.lineCap='round'; c.lineJoin='round';
    for(const s of strokes){ c.beginPath(); s.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])); if(s.length===1) c.lineTo(s[0][0]+.1,s[0][1]); c.stroke(); } };
  requestAnimationFrame(fit);
  pad.addEventListener('pointerdown',e=>{ e.preventDefault(); pad.setPointerCapture(e.pointerId); const r=pad.getBoundingClientRect(); cur=[[e.clientX-r.left,e.clientY-r.top]]; strokes.push(cur); redraw(); });
  pad.addEventListener('pointermove',e=>{ if(!cur) return; const r=pad.getBoundingClientRect(); cur.push([e.clientX-r.left,e.clientY-r.top]); redraw(); });
  pad.addEventListener('pointerup',()=>cur=null);
  const close=()=>{ scrim.remove(); if(tool==='sign') setTool('select'); };
  scrim.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ mode=b.dataset.t; scrim.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); scrim.querySelector('#sigDraw').hidden=mode!=='draw'; scrim.querySelector('#sigType').hidden=mode!=='type'; if(mode==='draw') requestAnimationFrame(fit); });
  scrim.querySelectorAll('[data-ink]').forEach(b=>b.onclick=()=>{ ink=b.dataset.ink; scrim.querySelectorAll('[data-ink]').forEach(x=>x.classList.toggle('on',x===b)); scrim.querySelector('#sigPrev').style.color=ink; redraw(); });
  const nm=scrim.querySelector('#sigName'); nm.oninput=()=>scrim.querySelector('#sigPrev').textContent=nm.value||' ';
  scrim.querySelector('#sigClear').onclick=()=>{ strokes=[]; nm.value=''; scrim.querySelector('#sigPrev').textContent=' '; redraw(); };
  scrim.querySelector('#sigCancel').onclick=close;
  scrim.addEventListener('pointerdown',e=>{ if(e.target===scrim) close(); });
  scrim.querySelector('#sigSaved')?.addEventListener('click',()=>{ scrim.remove(); beginPlace(lastSig.id,lastSig.w,lastSig.h,'Click where the signature goes'); });
  scrim.querySelector('#sigOk').onclick=async ()=>{
    let c;
    if(mode==='draw'){
      if(!strokes.length){ toast('Draw your signature first.'); return; }
      const xs=strokes.flat().map(q=>q[0]), ys=strokes.flat().map(q=>q[1]); const pd=4, S=3;
      const x0=Math.min(...xs)-pd, y0=Math.min(...ys)-pd, w=Math.max(...xs)+pd-x0, h=Math.max(...ys)+pd-y0;
      c=document.createElement('canvas'); c.width=Math.ceil(w*S); c.height=Math.ceil(h*S); const g=c.getContext('2d');
      g.scale(S,S); g.translate(-x0,-y0); g.strokeStyle=ink; g.lineWidth=2.6; g.lineCap='round'; g.lineJoin='round';
      for(const s of strokes){ g.beginPath(); s.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])); if(s.length===1) g.lineTo(s[0][0]+.1,s[0][1]); g.stroke(); }
    } else {
      const txt=nm.value.trim(); if(!txt){ toast('Type your name first.'); return; }
      try{ await document.fonts.load('600 120px Caveat'); }catch(e){}
      const g0=document.createElement('canvas').getContext('2d'); g0.font='600 120px Caveat, cursive'; const tw=g0.measureText(txt).width;
      c=document.createElement('canvas'); c.width=Math.ceil(tw+40); c.height=170; const g=c.getContext('2d'); g.font='600 120px Caveat, cursive'; g.fillStyle=ink; g.textBaseline='alphabetic'; g.fillText(txt,20,125);
    }
    const id=uid(); images[id]={url:c.toDataURL('image/png'), kind:'png'};
    const w=Math.min(170, c.width/3*0.75), h=w*c.height/c.width; lastSig={id,w,h};
    scrim.remove(); beginPlace(id,w,h,'Click where the signature goes');
  };
}

// ---------- tools & properties ----------
function setTool(t){
  if(t==='image'){ $('#fImg').click(); return; }
  if(t==='sign'){ tool='sign'; signatureModal(); renderRail(); return; }
  commitEdit();
  if(t!=='place') pending=null;
  tool=t; viewer.dataset.tool=t; if(t!=='select'&&t!=='text'&&t!=='edittext') selId=null;
  renderRail(); pages.forEach(renderOverlay); renderProps();
  if(t==='edittext'){ const missing=pages.some(p=>p.src&&!textCache[p.id]); if(missing) toast('Click any outlined text to edit it.'); else toast('Click any outlined text to edit it.'); }
}
function renderRail(){
  $('#rail').innerHTML = TOOLS.map(([t,label,key])=> t==='sep' ? '<div class="sep"></div>' :
    `<button class="tool${tool===t||(t==='sign'&&tool==='place'&&lastSig&&pending?.img===lastSig.id)?' on':''}" data-tool="${t}" aria-label="${label}">${ic(I[t])}<span class="tip">${label}<kbd>${key}</kbd></span></button>`).join('');
}
$('#rail').addEventListener('click', e=>{ const b=e.target.closest('[data-tool]'); if(b) setTool(b.dataset.tool); });

function ctxType(){
  if(selId){ const [,a]=findAnnot(selId); if(a) return a.type==='ink'?'draw':a.type; }
  return tool;
}
function renderProps(){
  const t=ctxType(); const [,a]=selId?findAnnot(selId):[null,null]; const v=(key,def)=> a&&a[key]!==undefined ? a[key] : (def!==undefined?def:props[key]);
  let h='';

  if(['text','draw','rect','ellipse','line','arrow'].includes(t)) h+=colorGrp('color',SWATCH,'Color');
  if(t==='highlight') h+=colorGrp(a?'color':'hl',HLS,'Highlight').replaceAll('data-set="color"', a?'data-set="color"':'data-set="hl"');
  if(t==='whiteout'){ const key=a?'fill':'wo'; h+=`<div class="grp"><label class="cap">Fill</label>${['#ffffff','#f4f1e8','#eeeeee','#000000'].map(c=>`<button class="sw${v(key,props.wo)===c?' on':''}" data-set="${key}" data-val="${c}" style="background:${c}" aria-label="Fill ${c}"></button>`).join('')}<input type="color" data-set="${key}" value="${v(key,props.wo)}" aria-label="Custom fill"></div>`; }

async function buildPdf(){
  const {PDFDocument, StandardFonts, rgb, degrees, BlendMode, LineCapStyle} = PDFLib;
  const out = await PDFDocument.create(); const loaded={}; const fonts={}; const imgs={};
  const col=h=>rgb(...hexRgb(h));
  for(const p of pages) if(p.src && !loaded[p.src]) loaded[p.src]=await PDFDocument.load(sources[p.src].bytes,{ignoreEncryption:true});
  if(window.fontkit) out.registerFontkit(window.fontkit);
  const getFont=async a=>{ const F=FONTS[a.font]||FONTS.Helvetica;
    if(F.std){ const n=F.std[(a.bold?1:0)+(a.italic?2:0)]; return fonts[n]||(fonts[n]={pdf:await out.embedFont(StandardFonts[n]), std:true}); }
    const k=F.slug+'-'+variantKey(F,a.bold,a.italic); if(fonts[k]) return fonts[k];
    try{ const bytes=await loadFontBytes(F.slug, variantKey(F,a.bold,a.italic));
      return fonts[k]={pdf:await out.embedFont(bytes,{subset:true}), fk:window.fontkit.create(bytes)}; }
    catch(e){ console.warn(e); return fonts[k]={failed:true}; } };
  const getImg=async id=>{ if(imgs[id]) return imgs[id]; const im=images[id]; return imgs[id]=(im.kind==='jpg'?await out.embedJpg(im.url):await out.embedPng(im.url)); };
  for(const p of pages){
    let page;
    if(p.src){ [page]=await out.copyPages(loaded[p.src],[p.index]); out.addPage(page); } else page=out.addPage([p.w,p.h]);
    page.setRotation(degrees(totalRot(p)));
    const box = p.src ? page.getCropBox() : {x:0,y:0};
    const X=x=>box.x+x, Y=y=>box.y+p.h-y;
    for(const a of p.annots){
      const op=a.opacity??1;
      if(a.type==='whiteout') page.drawRectangle({x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,color:col(a.fill)});
      else if(a.type==='highlight') page.drawRectangle({x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,color:col(a.color),opacity:0.4,blendMode:BlendMode.Multiply});
      else if(a.type==='rect'){ const sw=a.width; const o={x:X(a.x+sw/2),y:Y(a.y+a.h-sw/2),width:Math.max(0,a.w-sw),height:Math.max(0,a.h-sw),opacity:op,borderOpacity:op};
        if(a.fill) o.color=col(a.fill); if(sw>0){ o.borderColor=col(a.color); o.borderWidth=sw; } if(a.fill||sw>0) page.drawRectangle(o); }
      else if(a.type==='ellipse'){ const sw=a.width; const o={x:X(a.x+a.w/2),y:Y(a.y+a.h/2),xScale:Math.max(0.1,a.w/2-sw/2),yScale:Math.max(0.1,a.h/2-sw/2),opacity:op,borderOpacity:op};
        if(a.fill) o.color=col(a.fill); if(sw>0){ o.borderColor=col(a.color); o.borderWidth=sw; } page.drawEllipse(o); }
      else if(isVec(a.type)) page.drawSvgPath(pathD(a),{x:box.x,y:box.y+p.h,borderColor:col(a.color),borderWidth:a.width,borderOpacity:op,borderLineCap:LineCapStyle.Round});
      else if(a.type==='image') page.drawImage(await getImg(a.img),{x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,opacity:op});
      else if(a.type==='text'){
        const lines=a.text.split('\n'), lh=a.size*1.2, b0=a.y+baseOff(a);
        const f=await getFont(a); let ok=!f.failed && !COMPLEX.test(a.text);
        if(ok&&f.std){ try{ lines.forEach(l=>f.pdf.encodeText(l)); }catch(e){ ok=false; } }
        if(ok&&f.fk){ for(const ch of a.text){ const cp=ch.codePointAt(0); if(cp>32 && !f.fk.hasGlyphForCodePoint(cp)){ ok=false; break; } } }
        if(ok) lines.forEach((l,i)=>{ if(l) page.drawText(l,{x:X(a.x),y:Y(b0+i*lh),size:a.size,font:f.pdf,color:col(a.color)}); });
        else { // right-to-left scripts or glyphs the font lacks: embed the text as a crisp image
          await fontReady(a, a.text);
          const S=4; mctx.font=cssFont(a,a.size*S); const w=Math.max(...lines.map(l=>mctx.measureText(l).width))/S+2, h=lines.length*lh;

          g.font=cssFont(a,a.size*S); g.fillStyle=a.color; const rtl=/[\u0590-\u08FF]/.test(a.text); g.direction=rtl?'rtl':'ltr'; g.textAlign=rtl?'right':'left'; lines.forEach((l,i)=>g.fillText(l,rtl?c.width:0,(baseOff(a)+i*lh)*S));
          const im=await out.embedPng(c.toDataURL('image/png')); page.drawImage(im,{x:X(a.x),y:Y(a.y+h),width:w,height:h});
        }
      }
    }
  }
  out.setProducer('Redline PDF Editor'); out.setModificationDate(new Date());
  return await out.save();
}

async function download(){

    else { const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Downloading '+name); }

}
